version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    # Wait before proposing a fresh release, so a compromised or broken
    # version has time to be yanked. Security updates skip this.
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: chore
      include: scope # chore(deps): / chore(deps-dev):
    groups:
      bundler-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      bundler-security:
        applies-to: security-updates
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-action
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    cooldown:
      default-days: 3
      semver-major-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Madrid
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 2
